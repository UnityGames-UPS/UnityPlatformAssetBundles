name: Sync Unity Games to S3

on:
  push:
    branches:
      - dev-builds
    paths:
      - 'Android/**'
      - 'IOS/**'
      - 'WebGL/**'
      - 'README.md'

  workflow_dispatch:

jobs:
  sync-games:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed games
        id: changed-games
        shell: bash
        run: |
          set -uo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-parse "${AFTER}~1" 2>/dev/null || echo "")
          fi

          if [ -z "$BEFORE" ]; then
            git ls-tree -r --name-only "$AFTER" -- Android/ IOS/ WebGL/ \
              | awk -F/ 'NF >= 2 {print $1 "/" $2}' \
              | sort -u > changed_games.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" -- Android/ IOS/ WebGL/ \
              | awk -F/ 'NF >= 2 {print $1 "/" $2}' \
              | sort -u > changed_games.txt
          fi

          echo "Changed games:"
          cat changed_games.txt

      - name: Sync changed games to S3
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r game || [ -n "$game" ]; do
            [ -z "$game" ] && continue

            PLATFORM=$(echo "$game" | cut -d/ -f1)
            GAME=$(echo "$game" | cut -d/ -f2)
            GAME_LOWER=$(echo "$GAME" | tr '[:upper:]' '[:lower:]')

            LOCAL_PATH="$PLATFORM/$GAME"
            S3_GAME_PATH="s3://unity-platform-dev/$PLATFORM/Games/$GAME"

            echo "▶ Processing $PLATFORM/$GAME"

            if [ ! -d "$LOCAL_PATH" ]; then
              echo "Local path missing — deleting $S3_GAME_PATH/"

              aws s3 rm "$S3_GAME_PATH/" --recursive \
                || { echo "::error::Failed to delete $S3_GAME_PATH/"; exit 1; }

              continue
            fi

            EXISTING_VERSIONED_FILE=$(aws s3 ls "$S3_GAME_PATH/" 2>/dev/null \
              | awk '{print $4}' \
              | grep -iE "^${GAME_LOWER}\.v\.0\.0\.[0-9]+$" \
              | sort -V \
              | tail -n 1 || true)

            if [ -n "$EXISTING_VERSIONED_FILE" ]; then
              CURRENT_NUMBER=$(echo "$EXISTING_VERSIONED_FILE" \
                | sed -E "s/^${GAME_LOWER}\.v\.0\.0\.([0-9]+)$/\1/")

              case "$CURRENT_NUMBER" in
                ''|*[!0-9]*) CURRENT_NUMBER=0 ;;
              esac

              NEXT_NUMBER=$((CURRENT_NUMBER + 1))
            else
              NEXT_NUMBER=1
            fi

            NEW_NAME="${GAME_LOWER}.v.0.0.${NEXT_NUMBER}"
            NEW_VERSION="0.0.${NEXT_NUMBER}"

            aws s3 sync \
              "$LOCAL_PATH/" \
              "$S3_GAME_PATH/" \
              --delete \
              --exclude "version.json" \
              || { echo "::error::Failed to sync $LOCAL_PATH"; exit 1; }

            MATCHED_KEY=$(aws s3 ls "$S3_GAME_PATH/" 2>/dev/null \
              | awk '{print $4}' \
              | grep -ix "^${GAME_LOWER}$" \
              || true)

            if [ -n "$MATCHED_KEY" ]; then
              echo "Renaming $MATCHED_KEY -> $NEW_NAME"

              aws s3 mv \
                "$S3_GAME_PATH/$MATCHED_KEY" \
                "$S3_GAME_PATH/$NEW_NAME" \
                || { echo "::error::Failed to rename $MATCHED_KEY"; exit 1; }
            else
              echo "::warning::No file matching '$GAME_LOWER' found"
            fi

            TEMP_VERSION_FILE=$(mktemp)

            cat > "$TEMP_VERSION_FILE" <<EOF
          {
            "version": "$NEW_VERSION"
          }
          EOF

            aws s3 cp \
              "$TEMP_VERSION_FILE" \
              "$S3_GAME_PATH/version.json" \
              --content-type "application/json" \
              || { echo "::error::Failed to upload version.json"; rm -f "$TEMP_VERSION_FILE"; exit 1; }

            rm -f "$TEMP_VERSION_FILE"

            echo "✓ version.json updated to $NEW_VERSION"

          done < changed_games.txt

      - name: CloudFront Invalidation
        shell: bash
        run: |
          set -uo pipefail

          while IFS= read -r game || [ -n "$game" ]; do
            [ -z "$game" ] && continue

            PLATFORM=$(echo "$game" | cut -d/ -f1)
            GAME=$(echo "$game" | cut -d/ -f2)

            aws cloudfront create-invalidation \
              --distribution-id E2N87ID0IDFB9J \
              --paths "/$PLATFORM/Games/$GAME*" \
              || echo "::warning::CloudFront invalidation failed for $GAME"

          done < changed_games.txt

      - name: Discord Notification
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          DEPLOY_STATUS: ${{ job.status }}
          S3_BUCKET: unity-platform-dev
          CLOUDFRONT_ID: E2N87ID0IDFB9J
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "$DISCORD_WEBHOOK" ]]; then
            echo "::warning::Development Discord webhook is not configured."
            exit 0
          fi

          ENVIRONMENT="Development"

          # Changed games, comma separated
          CHANGED_GAMES="$(paste -sd, changed_games.txt 2>/dev/null | sed 's/,/, /g' || true)"
          if [[ -z "$CHANGED_GAMES" ]]; then
            CHANGED_GAMES="No game changes detected"
          fi

          # Use only the first line of the commit message
          if [[ -z "$COMMIT_MESSAGE" ]]; then
            COMMIT_MESSAGE="Manual workflow dispatch"
          else
            COMMIT_MESSAGE="${COMMIT_MESSAGE%%$'\n'*}"
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${SERVER_URL}/${REPOSITORY}/commit/${COMMIT_SHA}"
          WORKFLOW_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          DEPLOY_TIME="$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')"

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            COLOR=3066993
            TITLE="✅ ${ENVIRONMENT} S3 Upload Successful"
            STATUS_LINE="Success"
          else
            COLOR=15158332
            TITLE="❌ ${ENVIRONMENT} S3 Upload Failed"
            STATUS_LINE="Failed"
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg environment "$ENVIRONMENT" \
            --arg status "$STATUS_LINE" \
            --arg branch "$BRANCH" \
            --arg bucket "$S3_BUCKET" \
            --arg cloudfront "$CLOUDFRONT_ID" \
            --arg commit "$SHORT_SHA" \
            --arg commit_url "$COMMIT_URL" \
            --arg games "${CHANGED_GAMES:0:1000}" \
            --arg message "${COMMIT_MESSAGE:0:1000}" \
            --arg actor "$ACTOR" \
            --arg workflow_url "$WORKFLOW_URL" \
            --arg deployed_at "$DEPLOY_TIME" \
            --argjson color "$COLOR" \
            '{
              username: "Deploy Bot",
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name: "Environment", value: $environment, inline: true},
                  {name: "Status", value: $status, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "S3 Bucket", value: $bucket, inline: true},
                  {name: "CloudFront ID", value: $cloudfront, inline: true},
                  {name: "Commit ID", value: ("[" + $commit + "](" + $commit_url + ")"), inline: true},
                  {name: "Changed Games", value: $games, inline: false},
                  {name: "Commit Message", value: $message, inline: false},
                  {name: "Triggered By", value: $actor, inline: true},
                  {name: "Workflow", value: ("[View Run](" + $workflow_url + ")"), inline: false}
                ],
                footer: {
                  text: ("Deployment Time: " + $deployed_at)
                }
              }]
            }')

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -X POST \
            --data "$PAYLOAD" \
            "$DISCORD_WEBHOOK"

          echo "Discord notification sent successfully."
