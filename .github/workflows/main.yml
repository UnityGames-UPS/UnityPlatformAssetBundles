```yaml
name: Sync Unity Games to S3

on:
  push:
    branches:
      - dev-builds
    paths:
      - 'Android/**'
      - 'IOS/**'

  workflow_dispatch:

jobs:
  sync-games:
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed games
        id: changed-games
        shell: bash
        run: |
          git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            -- Android/ IOS/ \
            | awk -F/ 'NF >= 2 {print $1 "/" $2}' \
            | sort -u > changed_games.txt

      - name: Sync changed games to S3
        shell: bash
        run: |

          while read -r game; do

            [ -z "$game" ] && continue

            PLATFORM=$(echo "$game" | cut -d/ -f1)
            GAME_VERSION=$(echo "$game" | cut -d/ -f2)

            LOCAL_PATH="$PLATFORM/$GAME_VERSION"
            S3_BASE="s3://unity-platform-dev/$PLATFORM/Games"

            if [ -d "$LOCAL_PATH" ]; then

              GAME_NAME=$(echo "$GAME_VERSION" | sed -E 's/-[0-9]+$//')

              aws s3 ls "$S3_BASE/" | awk '{print $2}' | while read -r FOLDER; do

                [ -z "$FOLDER" ] && continue

                OLD_VERSION="${FOLDER%/}"

                if [[ "$OLD_VERSION" == "$GAME_NAME-"* ]] &&
                   [[ "$OLD_VERSION" != "$GAME_VERSION" ]]; then

                  aws s3 rm \
                    "$S3_BASE/$OLD_VERSION/" \
                    --recursive

                fi

              done

              aws s3 sync \
                "$LOCAL_PATH/" \
                "$S3_BASE/$GAME_VERSION/" \
                --delete

            else

              aws s3 rm \
                "$S3_BASE/$GAME_VERSION/" \
                --recursive

            fi

          done < changed_games.txt

      - name: CloudFront Invalidation
        shell: bash
        run: |

          while read -r game; do

            [ -z "$game" ] && continue

            PLATFORM=$(echo "$game" | cut -d/ -f1)
            GAME_VERSION=$(echo "$game" | cut -d/ -f2)

            INVALIDATION_PATH="/$PLATFORM/Games/$GAME_VERSION/*"

            aws cloudfront create-invalidation \
              --distribution-id E2N87ID0IDFB9J \
              --paths "$INVALIDATION_PATH"

          done < changed_games.txt

      - name: Discord Notification
        if: always()
        shell: bash
        run: |

          STATUS="${{ job.status }}"

          COLOR=3066993
          TITLE="✅ S3 Upload Successful"

          if [ "$STATUS" != "success" ]; then
            COLOR=15158332
            TITLE="❌ S3 Upload Failed"
          fi

          WEBHOOKS=(
            "${{ secrets.DISCORD_WEBHOOK_1 }}"
            "${{ secrets.DISCORD_WEBHOOK_2 }}"
          )

          CHANGED_GAMES=$(cat changed_games.txt 2>/dev/null | tr '\n' ',' | sed 's/,$//')

          if [ -z "$CHANGED_GAMES" ]; then
            CHANGED_GAMES="No game changes detected"
          fi

          for WEBHOOK in "${WEBHOOKS[@]}"; do

            curl --fail \
              -H "Content-Type: application/json" \
              -X POST \
              -d "{
                \"username\": \"Deploy Bot\",
                \"embeds\": [{
                  \"title\": \"$TITLE\",
                  \"color\": $COLOR,
                  \"fields\": [
                    {
                      \"name\": \"Changed Games\",
                      \"value\": \"$CHANGED_GAMES\"
                    },
                    {
                      \"name\": \"S3 Bucket\",
                      \"value\": \"unity-platform-dev\"
                    },
                    {
                      \"name\": \"CloudFront ID\",
                      \"value\": \"E2N87ID0IDFB9J\"
                    },
                    {
                      \"name\": \"Triggered By\",
                      \"value\": \"${{ github.actor }}\"
                    },
                    {
                      \"name\": \"Branch\",
                      \"value\": \"${{ github.ref_name }}\"
                    },
                    {
                      \"name\": \"Workflow\",
                      \"value\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }]
              }" \
              "$WEBHOOK"

          done
```
